<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg">
<!-- Same file as the Claude artifact "Creative Tree"; shim.js maps its storage and AI calls onto /api/tree/* -->
<title>Creative Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for a creative director: quiet, exact, nothing shouts
   IDEA a Swiss process map pinned to a warm grey studio wall; the tree grows from the inputs upward
   PICTURE the canvas itself: three floors, paper nodes led by one-line prompts, thin threads, the chosen path in one signal colour
   COLOUR warm grey ground, paper nodes, graphite ink, signal orange only for the chosen path, alerts and active state
   TYPE Inter Tight light for floor names, Inter for everything else
   LAYOUT canvas fills the screen, floor rail at left, tool dock at the bottom; side panel opens on demand; phone: it becomes a bottom sheet */
:root{color-scheme:light dark;
--bg:light-dark(#e6e3de,#1a1917);
--band:light-dark(#e1ded8,#1e1d1b);
--line:light-dark(#d2cec6,#33312d);
--paper:light-dark(#f7f5f1,#262421);
--paper2:light-dark(#efece6,#2d2b27);
--ink:light-dark(#1c1b19,#ece8e1);
--mute:light-dark(#6f6b63,#a19c93);
--faint:light-dark(#a39e94,#68635b);
--edge:light-dark(#b3ada3,#55524b);
--acc:#e0522b;
--ok:light-dark(#2f7a4b,#7cc79a);
--risk:light-dark(#a86b00,#e0b25a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--edge)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select,textarea{background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 5px;width:100%}
input:hover,textarea:hover,select:hover{border-color:var(--line)}
input:focus,textarea:focus,select:focus{border-color:var(--edge);background:var(--paper2);outline:none}
textarea{resize:none;field-sizing:content;min-height:2.6em;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:50px minmax(0,1fr);height:100%}
.app.noside{grid-template-columns:minmax(0,1fr)}
.app.noside .side{display:none}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font:500 15px/1 'Inter Tight',Inter,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.top select{width:auto;max-width:180px;border-color:var(--line)}
#pname{width:auto;field-sizing:content;min-width:80px;max-width:340px;font-weight:500;font-size:14px}
#pmenu{border:0;padding:4px 6px;color:var(--mute)}
.top .sl{color:var(--faint)}
.st{color:var(--faint);font-size:12px;white-space:nowrap;margin-left:auto}
.tb{white-space:nowrap}
.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#refall{border-color:var(--acc);color:var(--acc)}
.cv{position:relative;overflow:hidden;touch-action:none;background:var(--bg);user-select:none}
.cv.pan{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.band{position:absolute;left:-8000px;width:20000px;border-top:1px solid var(--line)}
.band:nth-child(even){background:var(--band)}
.band .hint{position:absolute;left:8040px;top:58px;color:var(--faint);font-size:13px;pointer-events:none}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.edges .ln{fill:none;stroke:var(--edge);stroke-width:1.2;pointer-events:none}
.edges .hit:hover+.ln{stroke:var(--mute)}
.edges .ln.on{stroke:var(--acc);stroke-width:1.8}
.edges .ln.off{stroke-dasharray:3 4;opacity:.6}
.edges .ln.sel{stroke:var(--ink);stroke-width:2}
.edges .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
.edges .tmp{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:5 4}
.rail{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;left:14px;display:flex;align-items:baseline;gap:8px;pointer-events:auto}
.fn{border:0;padding:0;font:300 26px/1 'Inter Tight',Inter,sans-serif;letter-spacing:-.02em;color:var(--ink)}
.fl.closed .fn{color:var(--mute);font-size:16px}
.fc{color:var(--faint);font-size:12px}
.fa{width:26px;height:26px;padding:0;border-radius:50%;line-height:1;font-size:16px;color:var(--mute)}
.cut{position:absolute;z-index:3;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;background:var(--paper);border:1px solid var(--edge);color:var(--ink);display:grid;place-items:center}
.cut[hidden]{display:none}
.cut:hover{border-color:var(--acc);color:var(--acc)}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.zoom button{border:0;min-width:30px;padding:4px 8px}
#zl{min-width:48px;color:var(--mute);font-size:12px}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.dock button{border:0;display:grid;justify-items:center;gap:3px;padding:6px 10px 5px;font-size:11.5px;color:var(--mute)}
.dock button:hover,.dock button.on{background:var(--paper2);color:var(--ink)}
.ico{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:6px;background:var(--paper2);border:1px solid var(--line);font:500 11px/1 Inter,sans-serif;color:var(--ink)}
.dpop{position:fixed;z-index:20;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:8px;width:min(560px,calc(100vw - 24px));max-height:min(60vh,520px);overflow-y:auto}
.dpop h4{margin:8px 6px 4px;font:500 12px/1.2 Inter,sans-serif;color:var(--faint)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:2px}
.tile{display:flex;align-items:center;gap:8px;border:0;text-align:left;padding:6px;border-radius:6px;cursor:grab}
.tile:hover{background:var(--paper2)}
.tile span:last-child{display:grid}
.tile small{color:var(--faint);font-size:11px;line-height:1.25}
.node{position:absolute;left:0;top:0;width:264px;background:var(--paper);border:1px solid var(--line);border-radius:9px;will-change:transform;cursor:grab;user-select:none}
.node input,.node textarea,.node select{user-select:text;cursor:auto}
.node img,.node video{-webkit-user-drag:none;user-drag:none}
.node .nt{cursor:grab}
.node .nt:focus{cursor:text}
body.dragging,body.dragging *{user-select:none!important;cursor:grabbing!important}
.node.wide{width:420px}
.node.task{width:560px;border-color:var(--ink)}
.node:hover{border-color:var(--edge)}
.node.sel{box-shadow:0 0 0 2px var(--ink)}
.node.pick{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.node.pick.sel{box-shadow:inset 3px 0 0 var(--acc),0 0 0 2px var(--ink)}
.node.hid{display:none}
.node.new{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0}}
.nh{display:block;padding:7px 10px 2px;min-height:24px}
.nk{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc{position:absolute;top:4px;right:4px;display:flex;align-items:center;gap:1px;z-index:2}
.nc>*{visibility:hidden}
.nc button,.nc a{background:var(--paper)}
.node:hover .nc>*,.node.sel .nc>*,.nc .cm,.nc .star.on,.nc .stl{visibility:visible}
.nc .stl[hidden]{display:none}
.nc a{color:var(--mute);text-decoration:none;padding:2px 6px;font-size:13px}
.fav{width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.kic{width:13px;height:13px;vertical-align:-2px;margin-right:6px;color:var(--mute)}
.nt{display:block;font:500 15px/1.3 Inter,sans-serif;padding:2px 9px 4px;margin:0 1px 2px;min-height:1.6em;width:calc(100% - 2px)}
.nt::placeholder{color:var(--faint);font-weight:400}
.task .nt{display:none}
.ib,.spk,.star{border:0;padding:2px 6px;color:var(--mute);font-size:15px;line-height:1}
.spk{color:var(--ink)}
.star{color:var(--faint)}
.star.on{color:var(--acc)}
.stl{border:1px solid var(--acc);color:var(--acc);font-size:11px;padding:1px 6px;border-radius:10px;margin-right:2px;white-space:nowrap}
.cm{min-width:22px;height:20px;padding:0 6px;font-size:11px;border-radius:10px 10px 10px 2px;background:var(--paper2)}
.cm.al{background:var(--acc);border-color:var(--acc);color:#fff}
.nb{padding:0 8px 6px}
.node.shut .nb,.node.shut .nf,.node.shut .why{display:none}
.meta{display:none;color:var(--faint);font-size:11.5px;padding:0 10px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.shut .meta{display:block}
.node.shut .nt{margin-bottom:0}
.node.brief{width:440px}
.node.brief .nh{min-height:0;padding:0}
.node.brief .nk{display:none}
.node.brief .nt{font:500 15px/1.3 'Inter Tight',Inter,sans-serif;padding:11px 96px 4px 11px}
.node.brief .nb{padding:0 10px 8px}
.bt{min-height:3.2em;font-size:14px;line-height:1.5;padding:4px 5px;color:var(--ink)}
.cmp{display:flex;align-items:center;gap:6px;padding:4px 0 0}
.cmp .sp{flex:1}
.ci{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--mute)}
.ci.on{color:var(--acc);border-color:var(--acc)}
.msel{width:auto;border-color:transparent;font-size:12.5px;color:var(--mute);padding:4px 2px;cursor:pointer}
.go{width:30px;height:30px;padding:0;border-radius:50%;background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:15px;line-height:1}
.nf:empty{display:none}
.docv{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;margin:2px auto 4px;border-radius:6px;cursor:zoom-in}
.doca{display:block;width:100%;height:36px;margin:4px 0}
.ftiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:2px 0 4px}
.ft{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--paper2);display:grid;place-items:center;cursor:zoom-in;border:0;padding:0}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft b{font:500 10.5px/1 Inter,sans-serif;color:var(--mute)}
.ft span{position:absolute;left:0;right:0;bottom:0;padding:10px 5px 4px;font-size:10px;line-height:1.2;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.ft:hover span{opacity:1}
.ft.nt0{align-content:center;gap:4px}
.ft.nt0 span{position:static;opacity:1;background:none;color:var(--mute);padding:0 5px;text-align:center}
.pickf{width:100%;padding:18px 8px;border:1px dashed var(--edge);border-radius:6px;color:var(--mute);margin:2px 0 4px}
.nobig{color:#ddd;display:grid;place-items:center;height:100%;text-align:center;font-size:14px;line-height:1.6}
.lpv{display:block;width:100%;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--paper2);margin:2px 0 4px;cursor:zoom-in}
.lpv img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.lurl{display:block;font-size:11.5px;color:var(--mute);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 3px 4px;cursor:pointer}
.lurl:hover{color:var(--ink);text-decoration:underline}
.ib svg{display:block}
.hov{display:none}
.node.shut:hover .hov{display:block;position:absolute;left:-1px;right:-1px;top:calc(100% + 6px);z-index:6;border-radius:8px;overflow:hidden;border:1px solid var(--edge);background:var(--paper2);pointer-events:none}
.hov img,.hov video{display:block;width:100%;max-height:260px;object-fit:cover;object-position:top}
.lbx{position:fixed;inset:0;z-index:40;background:rgba(12,12,11,.74);display:grid;place-items:center}
.lbx .fr{position:relative;width:min(1400px,92vw);height:88vh;border-radius:10px;overflow:hidden;background:#111}
.lbx iframe{width:100%;height:100%;border:0;background:#fff}
.lbx img,.lbx video{width:100%;height:100%;object-fit:contain;display:block}
.lbx .ac{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.lbx .fr:hover .ac,.lbx .ac:focus-within{opacity:1}
.lbx .ac a,.lbx .ac button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;text-decoration:none;font-size:12.5px}
.docf{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:6px;margin:2px 0 4px;color:var(--ink);text-decoration:none;font-size:12.5px}
.docf b{font:500 10.5px/1 Inter,sans-serif;padding:4px 5px;border-radius:4px;background:var(--paper2);color:var(--mute)}
.fold{border:0;padding:2px 5px;color:var(--faint);font-size:12px;line-height:1}
.nb>textarea[data-f=text]{color:var(--mute);font-size:12.5px}
.nf{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.nf button,.nf .lnk{font-size:12px;padding:4px 9px}
.nf .pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lnk{color:var(--ink);border:1px solid var(--line);border-radius:6px;text-decoration:none;display:inline-block}
.why input{color:var(--acc);font-size:12px}
.why{padding:0 8px 6px}
.rz{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;cursor:nwse-resize;opacity:0;background:linear-gradient(135deg,transparent 55%,var(--edge) 55%,var(--edge) 63%,transparent 63%,transparent 75%,var(--edge) 75%,var(--edge) 83%,transparent 83%);border-bottom-right-radius:9px}
.node:hover .rz,.node.sel .rz{opacity:1}
.port{position:absolute;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--paper);border:1px solid var(--edge);opacity:0;cursor:crosshair}
.pt{top:-6px}
.pb{bottom:-6px}
.node:hover .port,.node.sel .port{opacity:1}
.qt{position:absolute;right:0;bottom:100%;padding-bottom:7px;display:none;gap:4px}
.node:hover .qt,.node.sel .qt{display:flex}
.qt button{display:flex;align-items:center;gap:5px;background:var(--paper);font-size:11.5px;padding:3px 7px 3px 3px;border-radius:8px;white-space:nowrap}
.qt .ico{min-width:18px;height:18px;font-size:10px}
.task .tk{font:400 16px/1.45 Inter,sans-serif;color:var(--ink)}
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 2px}
.srcs a,.srcs button{font-size:11.5px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;color:var(--mute);text-decoration:none;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:4px 2px}
.th{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--paper2)}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;right:3px;top:3px;border:0;background:var(--paper);padding:0 6px;font-size:12px;opacity:0}
.th:hover button{opacity:1}
.fileth{display:grid;place-items:center;padding:6px;text-align:center}
.fileth a{font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.live{color:var(--acc);font-size:12px;margin:2px 3px}
.drophere{border:1px dashed var(--edge);border-radius:6px;padding:14px;color:var(--faint);text-align:center;margin:4px 2px;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;margin:2px 0}
.tbl td{padding:1px 2px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.ac{white-space:nowrap;text-align:right}
.tbl td.ac a,.tbl td.ac button{border:0;padding:3px 5px;font-size:12px;color:var(--mute);text-decoration:none}
.tbl input{font-size:12.5px}
.sel2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 62px;gap:4px;margin:2px 0 4px}
.sel2 select,.sel1{border-color:var(--line);font-size:12px;padding:4px}
.lbl{color:var(--faint);font-size:11.5px;margin:4px 3px 0}
.outs{display:grid;gap:6px;margin-top:6px;max-height:420px;overflow-y:auto}
.o{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--paper2)}
.o b{font-weight:500;display:block}
.o p{margin:2px 0 4px;color:var(--mute);font-size:12.5px;white-space:pre-wrap}
.o .r{display:flex;gap:4px}
.o .r button{font-size:11.5px;padding:2px 8px}
.v{font-size:11.5px;font-weight:500;margin-right:6px}
.v.pass,.ok i{color:var(--ok)}
.v.risk,.warn i{color:var(--risk)}
.v.fail,.conflict i{color:var(--acc)}
.svgimg{width:100%;display:block;border-radius:5px;background:var(--paper);border:1px solid var(--line);margin:4px 0}
.busy{height:2px;margin:6px 2px 0;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:run 1.1s linear infinite}
@keyframes run{from{background-position:-40% 0}to{background-position:140% 0}}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 2px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:20px;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{color:var(--faint);font-size:11.5px;margin:4px 3px}
.err{color:var(--acc);font-size:12px;margin:4px 3px}
.menu{position:fixed;z-index:20;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:4px;min-width:190px;max-width:340px;max-height:70vh;overflow-y:auto;display:grid}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.menu .cur{font-weight:500}
.menu .cur::before{content:'✓ ';color:var(--acc)}
.menu button{border:0;text-align:left;padding:7px 10px;border-radius:5px}
.menu button:hover{background:var(--paper2)}
.menu .dz{color:var(--acc)}
.pop{position:fixed;z-index:18;width:320px;max-width:calc(100vw - 24px);background:var(--paper);border:1px solid var(--edge);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:min(70vh,520px)}
.ph{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph button{border:0;padding:2px 8px}
.pt2{overflow-y:auto;padding:10px 12px;display:grid;gap:8px;align-content:start}
.pm{white-space:pre-wrap;font-size:13px}
.pm.me{background:var(--paper2);border-radius:8px;padding:6px 9px;justify-self:end;max-width:92%}
.pm i{display:block;font-style:normal;font-size:11.5px;font-weight:500;margin-bottom:2px}
.pm.wait{color:var(--faint)}
.pf{border-top:1px solid var(--line);padding:8px 10px;display:grid;gap:6px}
.pf textarea{border-color:var(--line);background:var(--bg);min-height:3em}
.pf .row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.pf .row button{font-size:12px;padding:4px 9px}
.pf .pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.side{display:grid;grid-template-rows:auto minmax(0,1fr);border-left:1px solid var(--line);background:var(--paper);min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;border-radius:6px 6px 0 0;padding:8px 12px;color:var(--mute);font:500 14px/1 'Inter Tight',Inter,sans-serif}
.tab[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tabs .mut{margin-left:auto;align-self:center}
.tabs .x{border:0;padding:4px 8px;align-self:center}
.pane{display:none;min-height:0}
.pane.on{display:grid}
#kit{grid-template-rows:auto minmax(0,1fr)}
#chat{grid-template-rows:minmax(0,1fr) auto}
.mut{color:var(--faint);font-size:12px}
.kq{padding:10px 12px;border-bottom:1px solid var(--line)}
.kq input{border-color:var(--line);background:var(--bg);font-size:14px;padding:7px 9px}
.kl{overflow-y:auto;padding:4px 6px 20px}
.kg{border-bottom:1px solid var(--line)}

/* staleness: a node remembers a fingerprint of everything upstream */
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36);}
function ancestors(n,seen=new Set()){for(const e of P.edges)if(e.b===n.id&&!seen.has(e.a)){seen.add(e.a);const a=byId(e.a);if(a)ancestors(a,seen);}return seen;}
const contentOf=x=>[x.title,x.text,x.links,x.q,x.url,x.nogo?'n':'',JSON.stringify(x.rows||[]),(x.items||[]).map(i=>i.id).join(','),x.drop?'d':''].join('|');
function upstream(n){const ids=new Set(ancestors(n));if(n.t==='task')P.nodes.forEach(x=>{if(x.f==='brief'&&x.id!==n.id&&!x.run)ids.add(x.id);});return [...ids].sort();}
function basisOf(n){return hashStr(upstream(n).map(id=>{const x=byId(id);return x?id+':'+contentOf(x):''}).join('\n'));}
function isStale(n){if(n.f==='brief'&&n.t!=='task'&&n.kind!=='read')return false;if(!upstream(n).length)return false;return !!n.basis&&basisOf(n)!==n.basis;}

function curve(A,B){

 if(Math.abs(ac-bc)<Math.max(A.h,B.h)/2){const a={x:A.x+A.w,y:ac},b={x:B.x,y:bc};if(B.x<A.x){a.x=A.x;b.x=B.x+B.w;}const k=Math.max(40,Math.abs(b.x-a.x)*.4)*(b.x>=a.x?1:-1);return `M${a.x} ${a.y}C${a.x+k} ${a.y} ${b.x-k} ${b.y} ${b.x} ${b.y}`;}

}

const thumbBusy=new Set();
async function pdfThumb(n){
 const it=n&&n.items&&n.items[0];if(!window.CT_PDF||!AS||!it||it.thumb||thumbBusy.has(it.id)||!blob(it))return;thumbBusy.add(it.id);

  const doc=await lib.getDocument({url:blob(it),withCredentials:true}).promise;const pg=await doc.getPage(1);
  const w1=pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:Math.min(2,900/w1)});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  await pg.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));if(!b)return;
  const up=await AS.upload(new File([b],(it.name||'pdf')+'.jpg',{type:'image/jpeg'}));
  it.thumb=up.id;it.pages=doc.numPages;if(byId(n.id))renderNode(n);save();
 }catch(_){}finally{thumbBusy.delete(it.id);}
}

async function thumbOf(file,kind){
